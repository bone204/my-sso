services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak-passo
    command: start-dev
    environment:
      KC_DB: ${KC_DB:-postgres}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_SPI_THEME_WELCOME_THEME: passo
    ports:
      - "8080:8080"
    volumes:
      - ./themes:/opt/keycloak/themes
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  # Demo Client App 1: Workspace Portal (Port 3001)
  demo-app1:
    image: nginx:alpine
    container_name: passo-demo-app1
    ports:
      - "3001:80"
    volumes:
      - ./demo/app1:/usr/share/nginx/html:ro
    restart: unless-stopped

  # Demo Client App 2: Analytics Portal (Port 3002)
  demo-app2:
    image: nginx:alpine
    container_name: passo-demo-app2
    ports:
      - "3002:80"
    volumes:
      - ./demo/app2:/usr/share/nginx/html:ro
    restart: unless-stopped

  # Optional: Local PostgreSQL service (alternative to Supabase)
  # Launch with: docker compose --profile local-db up -d
  postgres:
    image: postgres:16-alpine
    container_name: passo-postgres
    profiles:
      - local-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data:
